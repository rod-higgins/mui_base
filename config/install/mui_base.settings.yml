# Configuration defaults for MUI Base theme
# File: web/themes/custom/mui_base/config/install/mui_base.settings.yml

# Brand settings
brand_name: ''
brand_class: ''

# Logo settings
logo_type: 'image'
svg_logo: ''
logo_max_width: 120
logo_max_height: 40

# Layout settings - Default to Centered Layout
default_layout: 'centered'
mobile_breakpoint: 'md'
sticky_header: true

# Primary colors (Professional Blue)
primary_main: '#1976d2'
primary_light: '#42a5f5'
primary_dark: '#1565c0'

# Secondary colors (Orange)
secondary_main: '#ff9800'
secondary_light: '#ffb74d'
secondary_dark: '#f57c00'

# Tertiary colors (Light Grey)
tertiary_main: '#e0e0e0'
tertiary_light: '#eeeeee'
tertiary_dark: '#bdbdbd'

# Status colors
error_main: '#f44336'
warning_main: '#ff9800'
info_main: '#2196f3'
success_main: '#4caf50'

# Background colors
background_default: '#fafafa'
background_paper: '#ffffff'

# Typography settings
font_family: 'roboto'
custom_font_family: ''
font_size_base: 1.0

# Advanced settings
enable_dark_mode: false
enable_animations: true
enable_ripple: true
compact_mode: false

# Custom CSS
custom_css_code: ''