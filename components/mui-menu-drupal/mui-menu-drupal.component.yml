$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'MUI Menu Drupal'
description: 'Drupal integration wrapper for MUI Menu component with automatic menu loading and transformation'
props:
  type: object
  properties:
    # Drupal menu settings
    menu_name:
      type: string
      title: 'Menu name'
      description: 'Machine name of the Drupal menu'
      default: 'main'
    
    level:
      type: integer
      title: 'Starting level'
      description: 'Menu items below this level will not be displayed'
      default: 1
      minimum: 1
      maximum: 9
    
    depth:
      type: integer
      title: 'Maximum depth'
      description: 'Maximum depth of menu items to display'
      default: 0
      minimum: 0
      maximum: 9
    
    expanded:
      type: array
      title: 'Expanded parents'
      description: 'Array of expanded menu item IDs'
      default: []
    
    # Access and display settings
    check_access:
      type: boolean
      title: 'Check access'
      description: 'Only show accessible menu items'
      default: true
    
    show_active_trail:
      type: boolean
      title: 'Show active trail'
      description: 'Highlight active menu items'
      default: true
    
    active_trail_class:
      type: string
      title: 'Active trail CSS class'
      description: 'CSS class for active trail items'
      default: 'Mui-selected'
    
    absolute_urls:
      type: boolean
      title: 'Absolute URLs'
      description: 'Generate absolute URLs'
      default: false
    
    language_interface:
      type: boolean
      title: 'Language interface'
      description: 'Use interface language for URLs'
      default: true
    
    # Icon settings
    icon_field:
      type: string
      title: 'Icon field'
      description: 'Field machine name containing icon data'
      default: ''
    
    icon_default:
      type: string
      title: 'Default icon'
      description: 'Default icon for items without icons'
      default: ''
    
    # MUI Menu settings (inherited from base component)
    variant:
      type: string
      title: 'Menu variant'
      enum: ['menu', 'selectedMenu']
      default: 'menu'
    
    elevation:
      type: integer
      title: 'Menu elevation'
      enum: [0, 1, 2, 3, 4, 6, 8, 12, 16, 24]
      default: 8
    
    dense:
      type: boolean
      title: 'Dense spacing'
      default: false
    
    searchable:
      type: boolean
      title: 'Enable search'
      default: false
    
    search_placeholder:
      type: string
      title: 'Search placeholder'
      default: 'Search menu...'
    
    max_height:
      type: string
      title: 'Maximum height'
      default: 'calc(100vh - 96px)'
    
    min_width:
      type: string
      title: 'Minimum width'
      default: '112px'
    
    context_menu:
      type: boolean
      title: 'Context menu behavior'
      default: false
    
    auto_focus:
      type: boolean
      title: 'Auto focus'
      default: true
    
    open:
      type: boolean
      title: 'Open state'
      default: false
    
    # Content settings
    title:
      type: string
      title: 'Menu title'
      default: ''
    
    header_content:
      type: text
      title: 'Header content'
      format: 'html'
      default: ''
    
    footer_content:
      type: text
      title: 'Footer content'
      format: 'html'
      default: ''
    
    # JavaScript integration
    on_select:
      type: string
      title: 'Select handler'
      description: 'JavaScript function for item selection'
      default: ''
    
    on_close:
      type: string
      title: 'Close handler'
      description: 'JavaScript function for menu close'
      default: ''
    
    # Advanced settings
    menu_list_props:
      type: object
      title: 'MenuList props'
      default: {}
    
    virtual_scrolling:
      type: boolean
      title: 'Virtual scrolling'
      default: false
    
    disable_auto_focus_item:
      type: boolean
      title: 'Disable auto focus item'
      default: false
    
    # Positioning
    anchor_origin:
      type: object
      title: 'Anchor origin'
      properties:
        vertical:
          type: string
          enum: ['top', 'center', 'bottom']
          default: 'top'
        horizontal:
          type: string
          enum: ['left', 'center', 'right']
          default: 'left'
      default:
        vertical: 'top'
        horizontal: 'left'
    
    transform_origin:
      type: object
      title: 'Transform origin'
      properties:
        vertical:
          type: string
          enum: ['top', 'center', 'bottom']
          default: 'top'
        horizontal:
          type: string
          enum: ['left', 'center', 'right']
          default: 'left'
      default:
        vertical: 'top'
        horizontal: 'left'
    
    # Custom styling
    custom_classes:
      type: array
      title: 'Custom CSS classes'
      items:
        type: string
      default: []
    
    item_classes:
      type: array
      title: 'Item CSS classes'
      items:
        type: string
      default: []
    
    # Data inputs
    items:
      type: array
      title: 'Menu items'
      description: 'Pre-generated menu items (fallback)'
      default: []
    
    mui_menu_items:
      type: array
      title: 'Transformed menu items'
      description: 'Menu items transformed from Drupal menu tree'
      default: []
    
    menu_tree:
      type: object
      title: 'Menu tree'
      description: 'Drupal menu tree structure'
      default: {}
    
    # Cache settings
    cache_contexts:
      type: array
      title: 'Cache contexts'
      items:
        type: string
      default: ['url.path', 'user.roles']
    
    cache_tags:
      type: array
      title: 'Cache tags'
      items:
        type: string
      default: []
    
    # Processing callbacks
    transform_callback:
      type: string
      title: 'Transform callback'
      description: 'Function to transform menu items'
      default: ''

libraryDependencies:
  - mui_base/mui-menu